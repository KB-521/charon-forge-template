# Select with APP_ENV=prod (or SPRING_PROFILES_ACTIVE=prod).
# Server configuration is never copied into the web bundle.
environment:
  application:
    PORT: 7001
  web:
    API_BASE_URL: /api
    CORS_ORIGIN: ''
  oss:
    OSS_ENABLED: false
  logging:
    LOG_TO_FILE: true
    LOG_RETENTION_DAYS: 14
    LOG_TIME_ZONE: UTC
