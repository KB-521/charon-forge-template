name: Release
run-name: Release ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Generated by pnpm release
        required: true
      request_id:
        description: Unique release request ID
        required: true
permissions:
  contents: read
concurrency:
  group: charon-forge-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PLAN: ${{ inputs.plan }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Detect changes and verify selected packages
        id: prepare
        run: pnpm exec tsx scripts/publish-release.ts prepare
      - name: Publish and verify immutable template assets
        run: pnpm exec tsx scripts/publish-release.ts templates
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.has_channel == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.prepare.outputs.has_channel == 'true'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/publish/channel
      - uses: actions/deploy-pages@v4
        if: steps.prepare.outputs.has_channel == 'true'
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public channel and selected template downloads
        if: steps.prepare.outputs.has_channel == 'true'
        run: pnpm exec tsx scripts/publish-release.ts channel
      - name: Publish CLI when changed
        if: steps.prepare.outputs.has_cli == 'true'
        env:
          # npm exchanges the job OIDC identity; no long-lived publish token.
          NODE_AUTH_TOKEN: ''
        run: pnpm exec tsx scripts/publish-release.ts cli
      - name: Keep release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/publish/state.json
            dist/publish/release-plan.json
            dist/publish/catalog.json
            dist/publish/channel/
          if-no-files-found: ignore
